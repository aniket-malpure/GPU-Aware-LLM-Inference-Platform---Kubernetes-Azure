apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuautoscalers.inference.llmplatform.dev
spec:
  group: inference.llmplatform.dev
  scope: Namespaced
  names:
    kind: GPUAutoscaler
    listKind: GPUAutoscalerList
    plural: gpuautoscalers
    singular: gpuautoscaler
    shortNames: [gpuas]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Load
          type: number
          jsonPath: .status.lastLoad
        - name: Current
          type: integer
          jsonPath: .status.currentReplicas
        - name: Desired
          type: integer
          jsonPath: .status.desiredReplicas
        - name: Reason
          type: string
          jsonPath: .status.reason
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, maxReplicas, loadQuery]
              properties:
                targetRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                minReplicas:
                  type: integer
                  minimum: 0
                  default: 0
                maxReplicas:
                  type: integer
                  minimum: 1
                loadQuery:
                  type: string
                  description: PromQL returning total waiting + running requests for the target.
                targetLoadPerReplica:
                  type: number
                  default: 16
                scaleUpCooldownSeconds:
                  type: integer
                  default: 60
                scaleDownCooldownSeconds:
                  type: integer
                  default: 300
                idleSecondsBeforeZero:
                  type: integer
                  default: 900
            status:
              type: object
              properties:
                currentReplicas: {type: integer}
                desiredReplicas: {type: integer}
                lastLoad: {type: number}
                lastScaleTime: {type: string}
                lastActiveTime: {type: string}
                reason: {type: string}
