apiVersion: v1
kind: Namespace
metadata:
  name: gpu-autoscaler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-autoscaler
  namespace: gpu-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-autoscaler
rules:
  - apiGroups: ["inference.llmplatform.dev"]
    resources: ["gpuautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.llmplatform.dev"]
    resources: ["gpuautoscalers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-autoscaler
subjects:
  - kind: ServiceAccount
    name: gpu-autoscaler
    namespace: gpu-autoscaler
