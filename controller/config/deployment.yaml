apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-autoscaler
  namespace: gpu-autoscaler
  labels:
    app.kubernetes.io/name: gpu-autoscaler
spec:
  # Single replica: the controller is stateless between ticks and a second
  # copy would race on scale updates. Add leader election before raising this.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-autoscaler
    spec:
      serviceAccountName: gpu-autoscaler
      nodeSelector:
        workload: system
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Replaced by CI (scripts/deploy-controller.sh) with <acr>/gpu-autoscaler:<sha>
          image: ACR_LOGIN_SERVER/gpu-autoscaler:latest
          args:
            - --interval=15s
            - --log-level=info
          env:
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-autoscaler
  namespace: gpu-autoscaler
  labels:
    app.kubernetes.io/name: gpu-autoscaler
spec:
  selector:
    app.kubernetes.io/name: gpu-autoscaler
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpu-autoscaler
  namespace: gpu-autoscaler
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-autoscaler
  endpoints:
    - port: metrics
      interval: 15s
