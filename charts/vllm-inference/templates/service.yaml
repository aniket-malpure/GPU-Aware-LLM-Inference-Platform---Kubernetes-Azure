apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # Selects both tracks: canary share = canary pods / all ready pods.
  selector:
    {{- include "vllm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- range $track := list "stable" "canary" }}
{{- if or (eq $track "stable") $.Values.canary.enabled }}
# Per-track Service for smoke tests that must hit one track only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm.fullname" $ }}-{{ $track }}
  labels:
    {{- include "vllm.labels" $ | nindent 4 }}
    track: {{ $track }}
spec:
  type: ClusterIP
  selector:
    {{- include "vllm.selectorLabels" $ | nindent 4 }}
    track: {{ $track }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
---
{{- end }}
{{- end }}
