# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and rules from every namespace that carry the
    # release label (the vLLM chart and controller set it).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    scrapeInterval: 15s
    nodeSelector:
      workload: system
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi-premium
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

grafana:
  nodeSelector:
    workload: system
  adminPassword: ""         # set via --set grafana.adminPassword=... or an existing secret
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  defaultDashboardsTimezone: browser

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload: system
  # Add a receiver (Slack, email, Teams webhook) here to get paged.
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      routes:
        - matchers: ['severity="critical"']
          receiver: "null"
    receivers:
      - name: "null"

kube-state-metrics:
  nodeSelector:
    workload: system

prometheus-node-exporter:
  tolerations:
    - operator: Exists      # run on GPU nodes too
